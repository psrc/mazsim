# Shared categorical lookups: code -> label. Fill in the mappings; columns
# referencing an enum by name are restricted to that enum's keys once populated.
enums:
  building_type: {1: "mobile_home", 2: "single_family_detached", 3: "single_family_attached",
                  4: "multi_family_2_units", 5: "multi_family_3_4_units", 
                  6: "multi_family_5_9_units", 7: "multi_family_10_19_units", 
                  8: "multi_family_20_49_units", 9: "multi_family_50_plus_units", 10: "boat_rv_van"}
  tenure: {1: "owner", 2: "renter"}
  sector_id: {
    11: "agriculture", 21: "mining", 22: "utilities", 23: "construction", 3133: "manufacturing", 
    42: "wholesale_trade", 4445: "retail", 4849: "transportation_and_warehousing",
    51: "information", 52: "finance_and_insurance", 53: "real_estate", 54: "professional_services",
    55: "management", 56: "administrative_services", 61: "education", 62: "health_care",
    71: "arts_and_entertainment", 72: "accommodation_and_food_services", 81: "other_services",
    98: "government"
  }
  unit_type_id: {1: "single_family_owner",
                 2: "single_family_renter", 
                 3: "multi_family_owner", 
                 4: "multi_family_renter"}
  race: {1: "white", 2: "black", 3: "american_indian", 4: "alaska_native", 
         5: "american_indian_or_alaska_native", 6: "asian", 
         7: "native_hawaiian_pacific_islander", 8: "other", 9: "two_or_more_races"}
  sex: {1: "male", 2: "female"}
  industry: {0: "NA", 1121: "agriculture_mining", 23: "construction", 3133: "manufacturing", 
             42: "wholesale", 4445: "retail", 484922: "transportation_warehousing_utilities",
             51: "information", 5253: "finance_real_estate", 5456: "professional_management_admin",
             6162: "education_healthcare", 7172: "arts_entertainment_accommodation_food",
             81: "other_services", 98: "government"}
  occupation: {0: "NA",11: "management", 13: "business", 15: "computer", 17: "engineering", 
               19: "life_science", 21: "community_service", 23: "legal", 25: "educational", 
               27: "arts", 29: "healthcare_practitioner", 31: "healthcare_support", 
               33: "protective_service",35: "food_preparation", 37: "building_grounds_cleaning", 
               39: "personal_care", 41: "sales", 43: "office_administrative", 45: "farming_fishing_forestry",
               47: "construction_extraction", 49: "installation_maintenance_repair",
               51: "production", 53: "transportation_material_moving", 99: "unemployed"}
  income_quartile: {1: "lowest", 2: "lower_middle", 3: "upper_middle", 4: "highest"}

blocks:
  index: block_id
  columns:
    block_id: {dtype: int64}
    zone_id: {dtype: int64}
    x: {dtype: float64}
    y: {dtype: float64}
    res_rent: {dtype: float64, ge: 0}
    res_value: {dtype: float64, ge: 0}
    rent_impute: {dtype: bool}
    value_impute: {dtype: bool}
    acres_land: {dtype: float64, ge: 0}

households:
  index: household_id
  columns:
    household_id: {dtype: int64}
    puma_id: {dtype: int64}
    tract_id: {dtype: int64}
    block_id: {dtype: int64}
    hh_id: {dtype: int64}
    persons: {dtype: int64, ge: 0}
    building_type: {dtype: int64, enum: building_type}
    tenure: {dtype: int64, enum: tenure}
    income: {dtype: float64}
    rent: {dtype: float64, ge: 0}
    home_value: {dtype: float64, ge: 0}
    children: {dtype: int64, ge: 0}
    adults: {dtype: int64, ge: 0}
    workers: {dtype: int64, ge: 0}
    cars: {dtype: int64, ge: 0}
    age_of_head: {dtype: int64, ge: 0}
    race_of_head: {dtype: int64, enum: race}
    hispanic_status_of_head: {dtype: bool}
    recent_mover: {dtype: bool}
    wgtp: {dtype: float64, ge: 0}
    serialno: {dtype: str}
    year_built: {dtype: int64}

jobs:
  index: job_id
  columns:
    job_id: {dtype: int64}
    sector_id: {dtype: int64, enum: sector_id}
    block_id: {dtype: int64}

housing_units:
  index: unit_id
  columns:
    unit_id: {dtype: int64}
    block_id: {dtype: int64}
    year_built: {dtype: int64}
    unit_type_id: {dtype: float64, enum: unit_type_id}

persons:
  columns:
    puma_id: {dtype: int64}
    tract_id: {dtype: int64}
    block_id: {dtype: int64}
    hh_id: {dtype: int64}
    household_id: {dtype: int64}
    age: {dtype: int64, ge: 0}
    is_child: {dtype: bool}
    is_adult: {dtype: bool}
    is_worker: {dtype: bool}
    is_student: {dtype: bool}
    work_from_home: {dtype: bool}
    is_hispanic: {dtype: bool}
    race: {dtype: int64, enum: race}
    sex: {dtype: int64, enum: sex}
    industry: {dtype: int64, enum: industry}
    occupation: {dtype: int64, enum: occupation}
    pwgtp: {dtype: float64, ge: 0}
    serialno: {dtype: str}
    per_num: {dtype: int64, ge: 0}

transit_stops:
  columns:
    x: {dtype: float64}
    y: {dtype: float64}
    hct: {dtype: int64}

nodes:
  index: id
  columns:
    id: {dtype: int64}
    x: {dtype: float64}
    y: {dtype: float64}

edges:
  columns:
    from: {dtype: int64}
    to: {dtype: int64}
    weight: {dtype: float64, ge: 0}
    edge_type: {dtype: str}

job_calib_targets:
  index: tract_id
  columns:
    tract_id: {dtype: int64}
    jobs_2020: {dtype: float64, ge: 0}
    jobs_2010: {dtype: float64, ge: 0}
    jobs_target: {dtype: float64}

household_calib_targets:
  index: tract_id
  columns:
    tract_id: {dtype: int64}
    income_quartile: {dtype: int64, enum: income_quartile}
    households_2010: {dtype: float64, ge: 0}
    households_2020: {dtype: float64, ge: 0}
    households_target: {dtype: float64}

housing_unit_calib_targets:
  index: tract_id
  columns:
    tract_id: {dtype: int64}
    unit_type_id: {dtype: float64, enum: unit_type_id}
    units_2010: {dtype: float64, ge: 0}
    units_2020: {dtype: float64, ge: 0}
    units_target: {dtype: float64}

travel_data:
  index: [from_zone_id, to_zone_id]
  columns:
    from_zone_id: {dtype: int64}
    to_zone_id: {dtype: int64}
    am_single_vehicle_to_work_travel_time: {dtype: float64, ge: 0}

block_capacity:
  index: block_id
  columns:
    block_id: {dtype: int64}
    job_capacity: {dtype: int64, ge: 0}
    housing_unit_capacity: {dtype: int64, ge: 0}

annual_household_control_totals:
  columns:
    county_id: {dtype: int64}
    year: {dtype: int64}
    total_number_of_households: {dtype: int64, ge: 0}

annual_employment_control_totals:
  columns:
    county_id: {dtype: int64}
    year: {dtype: int64}
    total_number_of_jobs: {dtype: int64, ge: 0}
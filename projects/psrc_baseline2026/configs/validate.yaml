# settings for validation runs

# which geographies to run validation summaries for: tracts are what was used for calibration
geographies: 
  - tracts

variables:
  - households
  - housing_units
  - jobs

# scatterplot axes are scaled to this percentile of |change| so extreme observed values
# (notably jobs) don't flatten the rest of the cloud; off-scale points are pinned to the edge
clip_percentile: 99

additional_preprocessing_steps:
  - cache_base_data
  - save_full_tables
  - save_output_summaries

additional_simulation_steps:
  - create_validation_summaries

skip_simulation_steps:
  - place_observed_data

additional_postprocessing_steps:
  - archive_validation_summaries
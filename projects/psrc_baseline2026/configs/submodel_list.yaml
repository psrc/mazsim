# Metadata for each group in the submodel lists below, read by setup_lcms.
# ct_type names the settings.yaml injectable that decides whether the group is
# segmented by subregion; each group registers a "<group>_step_names" injectable.
submodel_groups:
  hlcm:
    ct_type: hh_ct_type
  hulcm:
    ct_type: hh_ct_type
  jlcm:
    ct_type: job_ct_type
    # unsegmented step names, used by the calibration steps
    unsegmented_injectable: reg_jlcm_step_names

# Table and column holding the subregion each agent belongs to.
subregion_source:
  table: blocks
  column: subregion_id

# Hedonic price models run by the rent/value price model steps.
price_models:
  rent_price_model: hupm_rent
  value_price_model: hupm_value
  # predictions are linear and can go negative, so they are clipped at zero
  clip:
    table: blocks
    columns: [res_rent, res_value]

# lcm sub-model yaml files registered by setup_lcms
submodel_list:
  hulcm:
    - hulcm1.yaml
    - hulcm2.yaml
    - hulcm3.yaml
    - hulcm4.yaml
  hlcm:
    - hlcm1.yaml
    - hlcm2.yaml
    - hlcm3.yaml
    - hlcm4.yaml
  jlcm:
    - jlcm5.yaml
    - jlcm4.yaml
    - jlcm3.yaml
    - jlcm2.yaml
    - jlcm1.yaml

# calibrated lcm sub-model yaml files registered by setup_lcms
submodel_list_calib:
  hulcm:
    - hulcm1_calib.yaml
    - hulcm2_calib.yaml
    - hulcm3_calib.yaml
    - hulcm4_calib.yaml
  hlcm:
    - hlcm1_calib.yaml
    - hlcm2_calib.yaml
    - hlcm3_calib.yaml
    - hlcm4_calib.yaml
  jlcm:
    - jlcm5_calib.yaml
    - jlcm4_calib.yaml
    - jlcm3_calib.yaml
    - jlcm2_calib.yaml
    - jlcm1_calib.yaml
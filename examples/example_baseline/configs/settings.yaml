#----------------------------------------
# settings registered as orca injectables
#----------------------------------------
# directories in relation to project root
data_dir: data
output_dir: output

# pandera schemas for the tables in data_sources.yaml, relative to this configs dir
data_model: data_model.py

# column holding each agent's location, at the finest geography in variables.yaml
geography_id: block_id

base_year: 2020
end_year: 2050

calibrated: true

# control total type (regional or subregional)
hh_ct_type: subregional
job_ct_type: subregional

# target housing vacancy rate used to size new housing unit supply each year
housing_vacancy_rate: 0.05

# use growth rates if no control totals are available
# job_growth_rate: 0.03
# household_growth_rate: 0.03

# full tables to be saved to output/results.h5
# more summmarized output tables are defined in output_summary.yaml
output_tables:
  - households
  - persons
  - jobs
  - housing_units

# additional orca steps can be defined in .py files placed in the custrom_steps_dir
# defined here. If multiple .py files are needed they can all be listed in custom_steps_files.
# by deault they are in a sinlge custom_steps.py file in the configs folder.
custom_steps_dir: configs
custom_steps_files: 
  - custom_steps.py

# additional orca variables defined in .py files placed in the custom_variables_dir and 
# listed in custom_variables_files
custom_variables_dir: configs
custom_variables_files:
  - custom_variables.py
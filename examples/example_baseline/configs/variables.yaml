# Configuration for orca variable registration (the "register_variables" step in variables.py).

# The finest geography; every other geography nests within it and variables land on it.
base_geography: {table: blocks, id: maz_id}

# Linked agents define hierarchical relationships between tables, where each child agent references a parent agent.
linked_agents:
  persons: {parent: households, key: household_id}

# Parent geography ids carved out of the base geography's index, which is a 15-digit census block id.
geography_ids:
  - {name: county_id, source: block_id, slice: [0, 6]}
  - {name: tract_id, source: block_id, slice: [0, 12]}
  - {name: block_group_id, source: block_id, slice: [0, 13]}

geographic_levels:
  - [block_groups, block_group_id]
  - [tracts, tract_id]
  - [counties, county_id]
  - [blocks, maz_id]
  - [zones, zone_id]

aggregation_functions: [mean, median, std, sum]

# Only vars listed in sum_vars get a "sum" aggregation; every var gets the other aggregation_functions.
variables_to_aggregate:
  persons: [worker_aggr_sector,worker_aggr_occ]
  households: [persons, cars, income, race_of_head, age_of_head, workers, children, tenure,
               recent_mover]
  jobs: [aggr_sector_id]
  housing_units: [year_built, built_after_2010, unit_type_id, sf, middle, mf, sf_built_prev_10_years, 
                  middle_built_prev_10_years, mf_built_prev_10_years]
  blocks: [x, y, acres, res_rent, res_value, obs_households, obs_jobs, obs_housing_units]

sum_vars: [persons, cars, income, workers, children, recent_mover, acres, housing_unit_capacity,
           job_capacity, built_after_2010, obs_households, obs_jobs, obs_housing_units,
           sf, middle, mf, sf_built_prev_10_years, middle_built_prev_10_years,
           mf_built_prev_10_years]

# Vars used to build prop_<var>_<category> and density_<agent> variables.
discrete_variables:
  persons: [worker_aggr_sector,worker_aggr_occ]
  households: [persons, cars, race_of_head, workers, children, tenure, recent_mover]
  jobs: [aggr_sector_id]
  housing_units: [year_built, unit_type_id]

# Numerator/denominator agent pairs for ratio_<a>_to_<b> at every geography.
ratio_variables:
  - [jobs, households]
  - [households, housing_units]
  - [cars, workers]

# Agents getting a density_<agent> variable. make_density_var divides by sum_acres,
# so the area variable must appear in sum_vars above.
density_agents: [households, jobs, housing_units]

geog_vars_to_dummify: [county_id]

# Project-specific derived columns. Each entry is dispatched on `kind` to a generator in
# variable_generators; `table`/`name` are positional, every other key is passed through.
# Registered before the aggregation pass, so these are available to aggregate/disaggregate.
derived_variables:
# Stands in for a filter expression where a submodel needs no filter.
  - table: blocks
    name: all_blocks
    kind: constant
    value: 1
    dtype: int32
    cache_scope: forever

skims:
  # Table holding the zone-to-zone impedances, and the zone table its ids refer to.
  table: travel_data
  zone_table: zones
  travel_times: [15, 30, 45]
  variables: [total_jobs, total_households, total_housing_units]
  # Column(s) in travel_data holding the travel time to sum accessibility over.
  columns: [am_single_vehicle_to_work_travel_time]

# Extra tables whose every column is pulled down onto the base geography, beyond the
# generated variables already disaggregated from each geographic_level.
disaggregations:
  - {from: nodes, key: node_id, exclude: [x, y]}
  - {from: zones, key: zone_id, requires_table: travel_data}
  - {from: block_groups, key: block_group_id}

pandana:
  onto_table: blocks
  # Column holding each row's nearest network node, set by the build_networks step.
  node_column: node_id
  distances: {start: 400, stop: 5000, step: 400}
  agg_types: [ave, sum]
  decay_types: [linear, flat]
  # Summarized from onto_table onto itself; each also gets a without_log_ twin.
  variables_to_aggregate: [total_households, total_jobs, sum_income,
                          major_road_node, prop_aggr_sector_id_1,
                          prop_aggr_sector_id_2, prop_aggr_sector_id_3,
                          prop_aggr_sector_id_4,  prop_aggr_sector_id_5,
                          prop_children_0,'sum_built_after_2010',
                          'res_rent','res_value', 'sum_sf', 'sum_middle', 'sum_mf',
                           'sum_sf_built_prev_10_years',
                          'sum_middle_built_prev_10_years', 'prop_tenure_1',
                          'sum_mf_built_prev_10_years', sum_children, prop_cars_0]
  # Summarized from a separate points-of-interest table, one variable per entry.
  poi_variables:
    - name_template: 'transit_stop_sum_{distance}_{decay}'
      pois_table: transit_stops
      agg_type: sum
      log: false
      dummy_prefix: is_
    - name_template: 'urban_center_sum_{distance}_{decay}'
      pois_table: urban_centers
      agg_type: sum
      log: false
      dummy_prefix: is_

# Controls the ln_/st_/st_ln_ pass. Columns already starting with a skip_prefix or
# ending with a skip_suffix are left alone.
transforms:
  table: blocks
  skip_prefixes: [ln, st, st_ln]
  skip_suffixes: [_id]
